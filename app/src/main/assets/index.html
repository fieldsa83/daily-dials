<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Dials Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column — today's four dials, then a 28-day grid and weekly averages */
:root {
  /* "Mocha light": warm light-brown background, cream cards, cocoa text, earthy buttons */
  --bg: #ebdfd2;
  --surface: #faf5ef;
  --ink: #3a2d24;
  --muted: #7a6a5e;
  --line: #ddd0c1;
  --accent: #6b4f3f;
  --ch-line: #1f4e79; --ch-dot: #b9d3ea; --ch-dot-edge: #3a6f9f; --ch-target: #a83232;
  --good: #94bb8b;          /* the green used for the weight bubble and the chart */
  --good-deep: #66bb57;
  --warn: #c0705c;          /* the target line */
  --pain: #c2543a;
  --activity: #2f7d4f;
  --anxiety: #7a55b0;
  --mood: #c08a17;
  --sleep: #3b6fb6;
  --other: #b0476e;
  --empty: #e6d9cb;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
/* Always this light look, even when the phone is in dark mode. data-theme="dark" on <html> would switch it. */
:root { color-scheme: light; }
:root[data-theme="dark"] {

  --bg: #11181d; --surface: #1a232a; --ink: #e6ecef; --muted: #93a2ad; --line: #2c3a43;
  --accent: #6fb7c2; --pain: #e47a5f; --activity: #5cbf83; --anxiety: #a888d8; --mood: #e2b44a; --sleep: #7fa6e0; --other: #e07ba0;
  --empty: #24313a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 34rem; margin: 0 auto; padding: 1.25rem 16px 3rem; display: flex; flex-direction: column; gap: 1.5rem; }
/* day header: the date centred, quiet chevrons either side; › hides on today */
header { display: grid; grid-template-columns: 2.5rem 1fr 2.5rem; align-items: center; text-align: center; }
header .ch { width: 2.5rem; height: 2.5rem; border: 0; background: none; color: var(--muted); font: 400 1.6rem/1 var(--body); opacity: .6; cursor: pointer; padding: 0; }
header .ch:disabled { visibility: hidden; }
header .ch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 50%; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.7rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.datebar { display: flex; align-items: center; gap: .35rem; }
.datebar button { background: var(--surface); border: 1px solid var(--line); color: var(--ink); width: 2.25rem; height: 2.25rem; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }
.datebar button:disabled { opacity: .35; cursor: default; }
.dials { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .25rem 1rem; }
.dial { padding: .85rem 0; display: flex; flex-direction: column; gap: .5rem; }
.dial-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.dial-name { font-family: var(--display); font-weight: 500; font-size: 1.15rem; }
.dial-val { font-size: .85rem; color: var(--muted); }
.scale { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: .5rem; }
/* solid colour buttons; once one is picked it lifts and the others shrink back */
.scale button {
  font: 700 1.15rem var(--body); font-variant-numeric: tabular-nums; height: 3.4rem; border-radius: 12px; border: 0; padding: 0 2px;
  background: var(--b); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .15s, opacity .15s, box-shadow .15s;
}
.scale button small { font: 400 .62rem/1.05 var(--body); color: var(--ink); opacity: .8; }
.scale.picked button { opacity: .55; transform: scale(.9); }
.scale.picked button[aria-pressed="true"] { opacity: 1; transform: translateY(-3px) scale(1.06); box-shadow: 0 6px 14px rgba(60, 40, 30, .25); }
.scale button:focus-visible, .datebar button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { display: flex; flex-direction: column; gap: .4rem; }
.note label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .75rem; min-height: 3.2rem; resize: vertical; }
#note { min-height: 2.8rem; height: 2.8rem; resize: none; transition: height .15s; }
#note:focus, #note.has-text { height: 6rem; }
.status { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
h2 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin: 0 0 .75rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; }
/* trend card: page 0 is the two-week grid, then one bar chart per dial; swipe or use the arrows */
.trend { padding: 16px 0 14px; position: relative; }
.tt { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 16px 10px; min-height: 30px; }
/* every card title the same: "All trends", "Mood trend", "Weight trend", and the dial names */
.tt .t1, .chart-panel > h2 { font: 500 1.1rem var(--display); }
.dial-name { font: 500 1rem var(--display); }   /* dial names a step below the card titles */
.tt .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt .t1 em { font-style: normal; color: var(--muted); }
.tt .t1 .sep { color: var(--muted); margin: 0 6px; }
.tt .ctl { display: flex; flex: none; }
.tt .ctl button { border: 0; background: none; color: var(--muted); font-size: 1.15rem; width: 28px; height: 30px; padding: 0; cursor: pointer; }
.tt .ctl button:disabled { opacity: .2; cursor: default; }
.tpages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.tpages::-webkit-scrollbar { display: none; }
.tpages > div { flex: 0 0 100%; scroll-snap-align: start; padding: 2px 16px; min-width: 0; }
/* the grid never takes more than about half the screen; with many indicators it scrolls inside */
.grid-wrap { max-height: calc(50vh - 7.5rem); overflow-y: auto; overflow-x: hidden; padding-right: 6px; margin-right: -6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.grid-wrap::-webkit-scrollbar { width: 5px; }
.grid-wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.grid, .gaxis { display: grid; grid-template-columns: 4.6rem repeat(7, minmax(0, 1fr)) 2.1rem 10px repeat(7, minmax(0, 1fr)) 2.1rem; column-gap: 3px; }
.grid { row-gap: 5px; align-items: center; }
.gaxis { margin-top: 8px; font-size: .68rem; color: var(--muted); padding-right: 6px; margin-right: -6px; }
.gaxis span { white-space: nowrap; text-align: center; }
.grid .lbl { font-size: .86rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid .av { font: 700 .88rem var(--display); text-align: center; font-variant-numeric: tabular-nums; border-radius: 6px; padding: 2px 0; background: var(--c); }
.cell { aspect-ratio: 1; border-radius: 2px; background: var(--empty); max-width: 100%; border: 0; padding: 0; cursor: pointer; }
.cell.sel, .tbar.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.tchart .pt { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 6px; font-size: .78rem; color: var(--muted); }
.tchart .pt b { font: 700 1.25rem var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.tchart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tchart svg text { font: .62rem var(--body); fill: var(--muted); }
.tbar { cursor: pointer; }
.tbub { position: absolute; z-index: 5; background: var(--ink); color: var(--surface); border-radius: 9px; padding: 5px 9px; font-size: .76rem; line-height: 1.3; white-space: nowrap; pointer-events: none; transform: translate(-50%, -100%); }
.tbub::after { content: ""; position: absolute; left: var(--ax, 50%); bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
.tbub b { font-size: .88rem; }
.wline { display: flex; justify-content: space-between; align-items: baseline; margin-top: .9rem; padding-top: .8rem; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
.wline b { white-space: nowrap; font-family: var(--display); font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.cell { aspect-ratio: 1; border-radius: 3px; background: var(--empty); max-width: 100%; }
.avgs { display: block; }
.avg { border-top: 3px solid var(--c); padding-top: .4rem; }
.avg b { font-family: var(--display); font-size: 1.4rem; font-variant-numeric: tabular-nums; display: block; }
.avg span { font-size: .75rem; color: var(--muted); }
.avg small { font-size: .72rem; color: var(--muted); display: block; }
.empty { color: var(--muted); font-size: .9rem; margin: .75rem 0 0; }
footer { font-size: .78rem; color: var(--muted); }
.settings summary { font-family: var(--display); font-weight: 500; font-size: 1.05rem; cursor: pointer; }
.set-body { display: flex; flex-direction: column; gap: .9rem; margin-top: 1rem; }
.field { display: flex; flex-direction: column; gap: .35rem; }
.field span { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .75rem; min-width: 0; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; }
.btn { font: 700 .95rem var(--body); padding: .65rem 1rem; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.group { display: flex; flex-direction: column; gap: .6rem; border: 1px solid var(--line); border-radius: 12px; padding: .8rem .9rem; margin: 0; }
.group legend { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 .3rem; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .3rem; }
.days button, .seg button { font: 700 .9rem var(--body); min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.days button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .3rem; }
.check { display: flex; align-items: center; gap: .6rem; min-height: 44px; }
.check input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; flex: none; }
.check input[type=time] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: .4rem .6rem; margin-left: auto; }
/* number dial (weight): a ruler you drag sideways; the value rides in a green bubble over the needle; each tick is 0.1 */
.rul { position: relative; height: 130px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: ew-resize; }
.rul::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, var(--surface), transparent 20%, transparent 80%, var(--surface)); }
.rul:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
.tk { position: absolute; top: 66px; border-radius: 2px; }
.tl { position: absolute; top: 104px; width: 40px; margin-left: -20px; text-align: center; font-size: .75rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.needle { position: absolute; left: 50%; top: 58px; width: 4px; height: 52px; margin-left: -2px; border-radius: 2px; background: var(--good); z-index: 1; }
.bub { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 2; transition: transform .15s; --bub: color-mix(in srgb, var(--good) 45%, var(--surface)); }
.bub.set { transform: translateX(-50%) translateY(-2px); --bub: var(--good); }
.bub-box { height: 46px; box-sizing: border-box; padding: 7px 16px 0; border-radius: 14px; display: flex; align-items: baseline; gap: .25rem; background: var(--bub);
  font: 700 1.5rem var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; transition: box-shadow .15s, background .15s; }
.bub.set .bub-box { box-shadow: 0 6px 14px rgba(60, 40, 30, .22); }
.bub-box span { font: 400 .8rem var(--body); color: var(--muted); }
.bub i { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid var(--bub); }
/* tabs */
/* tab bar: a floating pill near the bottom, within thumb reach; every tab the same width */
.tabs { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); margin: 0 auto; width: max-content; z-index: 10; display: flex; gap: 4px;
  padding: 6px; background: var(--surface); border: 1.5px solid #cdbdaa; border-radius: 30px; box-shadow: 0 10px 30px rgba(60, 40, 30, .24); }
/* the page fades into the background behind the tab bar, so nothing busy shows around or under it */
body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: calc(120px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 45%, transparent); pointer-events: none; z-index: 9; }
/* icons only; the current tab is a soft green capsule with its name beside the icon. Every tab is the same width. */
.tabs button { flex: none; width: 108px; min-height: 50px; border: 0; border-radius: 24px; background: transparent; color: var(--muted); font: 700 .85rem var(--body); cursor: pointer;
  display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 7px; transition: background .15s, color .15s; }
.tabs button svg { width: 22px; height: 22px; flex: none; }
.tabs button span { display: none; }
.tabs button[aria-selected="true"] { background: color-mix(in srgb, var(--good) 40%, var(--surface)); color: var(--ink); }
/* the weight tab and its dial use the chart line's navy; the bubble is pale blue until confirmed */
#tb-weight[aria-selected="true"] { background: #1f4e79; color: #fff; }
#ru-weight .needle { background: #1f4e79; }
#ru-weight .bub { --bub: #c9d8e8; }
#ru-weight .bub.set { --bub: #1f4e79; }
#ru-weight .bub.set .bub-box { color: #fff; }
#ru-weight .bub.set .bub-box span { color: #c9d9e8; }
.tabs button[aria-selected="true"] span { display: inline; }
.tabs button[hidden] { display: none; }
.wrap { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
body.on-settings header { display: none; }
.settings h2 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin: 0; }
.tab { display: flex; flex-direction: column; gap: 1.5rem; }
.tab[hidden] { display: none; }
/* number chart (weight over time) */
.chart-panel { display: flex; flex-direction: column; gap: .8rem; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.stats div { display: flex; flex-direction: column; }
.stats span { font-size: .72rem; color: var(--muted); }
.stats b { font: 700 1.15rem var(--display); font-variant-numeric: tabular-nums; }
/* range and smoothing as two compact segmented controls on one line */
.chip-row { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
/* under the chart: small rounded chips, the picked one softly tinted */
.chip-row { margin-top: .6rem; }
.segs { display: flex; gap: 4px; }
.chip { min-height: 28px; min-width: 2.1rem; padding: 0 .5rem; border: 0; border-radius: 99px; background: transparent; color: var(--muted); font: 700 .72rem var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--empty); color: var(--ink); }
.chart { position: relative; touch-action: pan-y; }
.chart-panel { padding-left: .5rem; padding-right: .5rem; }
.chart-panel > h2, .chart-panel .stats, .chart-panel .chip-row { padding: 0 .5rem; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .ax { font: 400 10.5px var(--body); fill: var(--muted); font-variant-numeric: tabular-nums; }
.readout-tip { position: absolute; top: 0; transform: translateX(-50%); padding: .2rem .5rem; border-radius: 8px; background: var(--ink); color: var(--surface); font: 700 .75rem var(--body); white-space: nowrap; pointer-events: none; }
.target-in { display: inline-flex; align-items: center; gap: .3rem; font: 700 .75rem var(--body); color: var(--muted); padding: 0 .3rem 0 .7rem; border: 1px solid var(--line); border-radius: 14px; }
.target-in input { width: 3.6rem; font: 700 .8rem var(--body); color: var(--ink); background: var(--bg); border: 0; border-radius: 8px; padding: .3rem .4rem; }
/* indicator editor */
.ind { border-bottom: 1px solid var(--line); }
.ind:last-child { border-bottom: 0; }
.ind > summary { list-style: none; display: flex; align-items: center; gap: .6rem; min-height: 48px; cursor: pointer; }
.ind > summary::-webkit-details-marker { display: none; }
.ind > summary b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ind > summary small { color: var(--muted); font-size: .75rem; white-space: nowrap; }
.ind > summary::after { content: "›"; color: var(--muted); font-size: 1.2rem; transition: transform .15s; }
.ind[open] > summary::after { transform: rotate(90deg); }
.ind .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.ind-body { display: flex; flex-direction: column; gap: .5rem; padding: 0 0 .8rem; }
.ind-top { display: flex; align-items: center; gap: .25rem; }
.ind-top input { flex: 1; min-width: 0; font: 700 1rem var(--body); color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: .4rem; }
.ind-top input:focus { border-color: var(--line); background: var(--bg); outline: none; }
.ind-top button { width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
.ind-top button.rm { color: var(--pain); }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; padding-left: .4rem; }
.chips span, .chips button { font: 700 .75rem var(--body); padding: .4rem .7rem; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.chips button { cursor: pointer; color: var(--ink); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.hint { margin: 0; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .scale button, .bub, .bub-box { transition: none; } }
</style>

</head><body>
<div class="wrap">
  <header>
    <button class="ch" id="prev" aria-label="Previous day">‹</button>
    <h1 id="dayLabel">Today</h1>
    <button class="ch" id="next" aria-label="Next day">›</button>
  </header>

  <div class="tab" id="tab-checkin" role="tabpanel" aria-labelledby="tb-checkin">
  <section class="panel trend" id="trend" aria-label="Trend">
    <div class="tt"><span class="t1" id="trendName">All trends</span>
      <div class="ctl"><button id="tPrev" aria-label="Previous chart">‹</button><button id="tNext" aria-label="Next chart">›</button></div></div>
    <div class="tpages" id="tPages"></div>
  </section>

  <section class="dials" id="dials" aria-label="Ratings"></section>

  <div class="note">
    <textarea id="note" placeholder="Add a note…" aria-label="Note"></textarea>
    <div class="status" id="status" role="status"></div>
  </div>

  </div>

  <div class="tab" id="tab-weight" role="tabpanel" aria-labelledby="tb-weight" hidden>
    <div id="charts"></div>
    <section class="dials" id="numDials" aria-label="Numbers"></section>
  </div>

  <div class="tab" id="tab-settings" role="tabpanel" aria-labelledby="tb-settings" hidden>
  <section class="panel settings" id="indicators">
    <h2>Indicators</h2>
    <div class="set-body">
      <p class="hint">Tap one to rename, reorder or change it. Removing hides it; its past values stay in the sheet.</p>
      <div id="indList"></div>
      <div id="indRemoved"></div>
      <fieldset class="group">
        <legend>Add an indicator</legend>
        <label class="field"><span>Name</span><input id="newName" placeholder="Nutrition — did I eat healthy?" autocomplete="off"></label>
        <div class="seg" id="newKind" role="group" aria-label="Kind" style="grid-template-columns: repeat(2, minmax(0, 1fr))">
          <button data-v="scale" aria-pressed="true">0–5 dial</button><button data-v="number" aria-pressed="false">Number (like weight)</button>
        </div>
        <div class="row"><button class="btn" id="addInd">Add</button></div>
      </fieldset>
    </div>
  </section>

  <section class="panel settings" id="numSettings">
    <h2>Weight</h2>
    <div class="set-body" id="numList"></div>
  </section>

  <section class="panel settings" id="reminders">
    <h2>Reminders</h2>
    <div class="set-body">
      <label class="field"><span>Remind me at</span><input type="time" id="remTime" value="19:00"></label>
      <div class="days" id="days" role="group" aria-label="Days">
        <button data-bit="0" aria-label="Monday">M</button><button data-bit="1" aria-label="Tuesday">T</button><button data-bit="2" aria-label="Wednesday">W</button><button data-bit="3" aria-label="Thursday">T</button><button data-bit="4" aria-label="Friday">F</button><button data-bit="5" aria-label="Saturday">S</button><button data-bit="6" aria-label="Sunday">S</button>
      </div>
      <div class="check"><input type="checkbox" id="weekendOn"><label for="weekendOn">Different time on weekends</label><input type="time" id="weekendTime" value="10:00" aria-label="Weekend reminder time"></div>
      <label class="check"><input type="checkbox" id="nudge" checked>Nudge again 2 hours later if I haven't answered</label>
      <div class="seg" id="alert" role="group" aria-label="Alert style">
        <button data-v="silent">Silent</button><button data-v="vibrate">Vibrate</button><button data-v="sound">Sound</button>

<nav class="tabs" role="tablist" aria-label="Sections">

<script>
// The indicators come from assets/indicators.json, or the edited copy the app keeps (see "Indicators" panel).
// kind "scale" = a 0–5 dial; kind "number" = a ruler with one decimal (weight). "hidden" = removed.
let INDICATORS = [];
let METRICS = [];   // the visible ones, in order
// one fixed colour per step, worst → best (no blending, so no muddy in-betweens)
const STOPS = ["#de8878", "#efac72", "#f3d465", "#c4d98f", "#94bb8b", "#66bb57"];   // coral → orange → yellow → green
function goodness(m, v) { const t = v / 5; return m.high ? t : 1 - t; }
function colour(g) {
  return STOPS[Math.round(Math.max(0, Math.min(1, g)) * (STOPS.length - 1))];
}
const has = v => v !== null && v !== undefined;
const SCALE = [0, 1, 2, 3, 4, 5];
const isScale = m => m.kind !== "number";
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
// A check-in before 4 AM counts for the previous day (matches Store.DAY_STARTS_AT_HOUR in the app).
const DAY_STARTS_AT_HOUR = 4;
const todayIso = () => iso(new Date(Date.now() - DAY_STARTS_AT_HOUR * 3600e3));
const shift = (s, n) => { const [y,m,d] = s.split("-").map(Number); return iso(new Date(y, m-1, d+n)); };
const label = s => {
  if (s === todayIso()) return "Today";
  if (s === shift(todayIso(), -1)) return "Yesterday";
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
};

let current = todayIso();
let entries = {};          // date -> {pain, activity, anxiety, mood, note}
let store = null;          // {save(date, obj), remove?}
const $ = id => document.getElementById(id);

// ---- build dials
const dials = $("dials");
function buildDials() {
  dials.innerHTML = "";
  $("numDials").innerHTML = ""; $("charts").innerHTML = "";
  rulers.clear();
  const nums = METRICS.filter(m => !isScale(m));
  $("tb-weight-label").textContent = nums.length === 1 ? nums[0].name : "Numbers";
  $("tb-weight").hidden = !nums.length;
  if (!nums.length && currentTab === "weight") showTab("checkin");
  for (const m of METRICS) {
    const el = document.createElement("div");
    el.className = "dial";
    if (isScale(m)) {
      el.style.setProperty("--n", 6);
      // end labels follow "high is good": Bad → Good (mood, sleep…), or None → Max for pain-type dials
      const word = n => n === 0 ? `<small>${m.high ? "Bad" : "None"}</small>` : n === 5 ? `<small>${m.high ? "Good" : "Max"}</small>` : "";
      el.innerHTML = `<div class="dial-head"><span class="dial-name">${esc(m.name)}</span></div>
        <div class="scale" id="s-${m.key}" role="group" aria-label="${esc(m.name)}, 0 to 5">${SCALE.map(n => `<button id="b-${m.key}-${n}" data-k="${m.key}" data-n="${n}" aria-pressed="false" style="--b:${colour(goodness(m, n))}"><span>${n}</span>${word(n)}</button>`).join("")}</div>`;
    } else {
      el.innerHTML = `<div class="dial-head"><span class="dial-name">${esc(m.name)}</span><span class="dial-val" id="v-${m.key}"></span></div>
        <div class="rul" id="ru-${m.key}" role="slider" tabindex="0" aria-label="${esc(m.name)}${m.unit ? " in " + esc(m.unit) : ""}"></div>`;
    }
    if (isScale(m)) { dials.appendChild(el); continue; }
    $("numDials").appendChild(el);
    setupRuler(m);
    buildChart(m);
  }
}

// ---- number dials (weight): a ruler in tenths. Drag sideways; the value rides in the green bubble over the needle.
const PX = 12;                 // pixels per 0.1
const rulers = new Map();      // key -> { el, t, set, drag }
function lastValue(key, before) {
  const ds = Object.keys(entries).filter(d => d < before && has(entries[d]?.[key])).sort();
  return ds.length ? entries[ds[ds.length - 1]][key] : null;
}
function drawRuler(m, t, set) {
  const r = rulers.get(m.key); if (!r) return;
  r.t = t; r.set = set;
  const c = r.el.clientWidth / 2 || 160, span = Math.ceil(c / PX) + 2;
  let html = "";
  for (let v = t - span; v <= t + span; v++) {
    if (v < 0) continue;
    const x = c + (v - t) * PX, major = v % 10 === 0, half = v % 5 === 0;
    html += `<div class="tk" style="left:${x - (major ? 1.5 : 1)}px;width:${major ? 3 : 2}px;height:${major ? 30 : half ? 22 : 14}px;background:${major ? "var(--ink)" : "color-mix(in srgb, var(--muted) 60%, transparent)"}"></div>`;
    if (major) html += `<div class="tl" style="left:${x}px">${v / 10}</div>`;
  }
  html += `<div class="needle"></div><div class="bub${set ? " set" : ""}"><div class="bub-box">${(t / 10).toFixed(1)}<span>${esc(m.unit || "")}</span></div><i></i></div>`;
  r.el.innerHTML = html;
  r.el.setAttribute("aria-valuenow", (t / 10).toFixed(1));
}
function setupRuler(m) {
  const el = $(`ru-${m.key}`);
  const r = { el, t: 0, set: false, drag: null };
  rulers.set(m.key, r);
  el.addEventListener("pointerdown", e => { r.drag = { x: e.clientX, t: r.t, moved: false, onBubble: !!e.target.closest(".bub") }; el.setPointerCapture?.(e.pointerId); });
  el.addEventListener("pointermove", e => {
    if (!r.drag) return;
    const n = Math.max(0, r.drag.t + Math.round((r.drag.x - e.clientX) / PX));
    if (n !== r.t) { r.drag.moved = true; drawRuler(m, n, true); if (App?.tick) App.tick(); else if (navigator.vibrate) navigator.vibrate(4); }   // a click per notch
  });
  // a drag saves the new value; a tap on the pale bubble confirms the shown weight as today's (same as last time)
  const end = () => {
    const save = r.drag?.moved || (r.drag?.onBubble && !r.set);
    r.drag = null;                       // finish the gesture first, so the redraw shows the saved state
    if (save) setNumber(m.key, r.t / 10);
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    setNumber(m.key, (r.t + (e.key === "ArrowRight" ? 1 : -1)) / 10);
  });
}
function setNumber(key, v) {
  const cur = { ...(entries[current] || {}) };
  // <key>_carried: 0 = entered by hand, 1 = carried forward from an earlier day, absent = no value at all
  if (v == null) { delete cur[key]; delete cur[`${key}_carried`]; }
  else { cur[key] = Math.round(v * 10) / 10; cur[`${key}_carried`] = 0; }
  entries[current] = cur;
  renderDay(); renderHistory(); queueSave();
}
dials.addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  const k = b.dataset.k, n = +b.dataset.n;
  const cur = { ...(entries[current] || {}) };
  cur[k] = cur[k] === n ? null : n;   // tap again to clear
  entries[current] = cur;
  renderDay(); renderHistory(); queueSave();
});

let noteTimer;
$("note").addEventListener("input", () => {
  entries[current] = { ...(entries[current] || {}), note: $("note").value };
  clearTimeout(noteTimer); noteTimer = setTimeout(queueSave, 700);
});
$("prev").onclick = () => { flush(); current = shift(current, -1); renderDay(); };
$("next").onclick = () => { if (current < todayIso()) { flush(); current = shift(current, 1); renderDay(); } };

function renderDay() {
  $("dayLabel").textContent = longDay(current);
  $("next").disabled = current >= todayIso();
  const e = entries[current] || {};
  for (const m of METRICS) {
    if (isScale(m)) {
      for (const n of SCALE) $(`b-${m.key}-${n}`).setAttribute("aria-pressed", e[m.key] === n ? "true" : "false");
      $(`s-${m.key}`).classList.toggle("picked", has(e[m.key]));
    } else {
      const v = has(e[m.key]) ? e[m.key] : null;
      const shown = v ?? lastValue(m.key, current) ?? m.start ?? 0;
      const prev = lastValue(m.key, current);
      const diff = v != null && prev != null ? Math.round((v - prev) * 10) / 10 : null;
      $(`v-${m.key}`).textContent = v == null ? (prev != null ? `Last: ${prev.toFixed(1)} · tap to confirm` : "Drag to set")
        : Number(e[`${m.key}_carried`]) === 1 ? "Carried forward"
        : diff == null ? "" : diff === 0 ? "Same as last" : `${diff > 0 ? "+" : "−"}${Math.abs(diff).toFixed(1)} from last`;
      const ru = rulers.get(m.key);
      if (ru && !ru.drag) drawRuler(m, Math.round(shown * 10), v != null);
    }
  }
  if (document.activeElement !== $("note")) $("note").value = e.note || "";
  $("note").classList.toggle("has-text", !!$("note").value);
}

let trendPage = 0;
const md = s => { const [y, mo, d] = s.split("-").map(Number); return new Date(y, mo - 1, d); };
const shortDay = s => md(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const longDay = s => md(s).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
function renderHistory() {
  renderCharts();
  const t = todayIso();
  const days = Array.from({ length: 14 }, (_, i) => shift(t, i - 13));
  const scales = METRICS.filter(isScale);
  const mean = (key, ds) => { const vs = ds.map(d => entries[d]?.[key]).filter(has); return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null; };
  const pill = (m, a) => `<div class="av" style="--c:${a == null ? "var(--empty)" : colour(goodness(m, a))}">${a == null ? "–" : a.toFixed(1)}</div>`;
  let any = false, grid = "";
  for (const m of scales) {
    grid += `<div class="lbl">${esc(m.short || m.name)}</div>`;
    days.forEach((d, j) => {
      if (j === 7) grid += pill(m, mean(m.key, days.slice(0, 7))) + `<div></div>`;
      const v = entries[d]?.[m.key];
      if (has(v)) any = true;
      grid += `<button class="cell" data-k="${m.key}" data-d="${d}" aria-label="${esc(m.name)}, ${esc(longDay(d))}: ${has(v) ? v : "no entry"}"${has(v) ? ` style="background:${colour(goodness(m, v))}"` : ""}></button>`;
    });
    grid += pill(m, mean(m.key, days.slice(7)));
  }
  const wk = (a, b) => `${shortDay(a)} – ${md(b).getDate()}`;
  const page0 = `<div><div class="grid-wrap"><div class="grid">${grid}</div></div>
    <div class="gaxis"><span></span><span style="grid-column:span 7">${wk(days[0], days[6])}</span><span>avg</span><span></span><span style="grid-column:span 7">${wk(days[7], days[13])}</span><span>avg</span></div>
    ${any ? "" : `<p class="empty">Your check-ins will fill this grid. Green is a good day for that item, coral a bad one.</p>`}</div>`;
  const charts = scales.map(m => {
    const a = mean(m.key, days);
    return `<div class="tchart"><div class="pt"><span>${m.high ? "0 bad · 5 good" : "0 none · 5 max"}</span><span><b>${a == null ? "–" : a.toFixed(1)}</b> avg</span></div>${trendBars(m, days)}</div>`;
  });
  const pg = $("tPages");
  pg.innerHTML = page0 + charts.join("");
  pg._names = ["All trends", ...scales.map(m => `${m.name} trend`)];
  trendPage = Math.min(trendPage, pg._names.length - 1);
  pg.style.scrollBehavior = "auto"; pg.scrollLeft = trendPage * pg.clientWidth; pg.style.scrollBehavior = "";
  trendSync(true);
}
function trendBars(m, days) {
  const W = 340, H = 140, L = 16, B = 18, T = 6, n = days.length, bw = (W - L) / n, Y = v => T + (5 - v) / 5 * (H - T - B);
  let g = "";
  for (let v = 0; v <= 5; v++) { g += `<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v ? .6 : 1}"/>`; if (v === 0 || v === 5) g += `<text x="${L - 5}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`; }
  days.forEach((d, i) => {
    const v = entries[d]?.[m.key], x = L + i * bw + bw * .15, w = bw * .7;
    if (!has(v)) { g += `<rect x="${x}" y="${H - B - 2}" width="${w}" height="2" rx="1" fill="var(--empty)"/>`; return; }
    const hh = Math.max(3, H - B - Y(v));
    g += `<rect class="tbar" data-k="${m.key}" data-d="${d}" x="${x}" y="${H - B - hh}" width="${w}" height="${hh}" rx="4" fill="${colour(goodness(m, v))}"/>`;
  });
  const vs = days.map(d => entries[d]?.[m.key]).filter(has);
  if (vs.length) { const ya = Y(vs.reduce((a, b) => a + b, 0) / vs.length); g += `<line x1="${L}" x2="${W}" y1="${ya}" y2="${ya}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>`; }
  [0, 7, n - 1].forEach(i => g += `<text x="${L + i * bw + bw / 2}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${shortDay(days[i])}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.name)}, last 14 days">${g}</svg>`;
}
// which page is showing → title and arrows
function trendSync(force) {
  const pg = $("tPages"); if (!pg._names) return;
  const i = pg.clientWidth ? Math.round(pg.scrollLeft / pg.clientWidth) : trendPage;
  if (i === trendPage && !force) return;
  if (i !== trendPage) trendBubble(null);
  trendPage = i;
  $("trendName").textContent = pg._names[i] || "";
  $("tPrev").disabled = i === 0; $("tNext").disabled = i >= pg._names.length - 1;
}
const trendGo = i => { const pg = $("tPages"); i = Math.max(0, Math.min(pg._names.length - 1, i)); pg.scrollTo({ left: i * pg.clientWidth, behavior: "smooth" }); };
$("tPrev").onclick = () => trendGo(trendPage - 1);
$("tNext").onclick = () => trendGo(trendPage + 1);
{ let tm; $("tPages").addEventListener("scroll", () => { clearTimeout(tm); tm = setTimeout(() => trendSync(false), 90); }); }
// tap a square or a bar → a small bubble with the day and value; tap again or elsewhere to close
let tbub = null, tsel = null;
function trendBubble(t) {
  if (tbub) tbub.remove(); if (tsel) tsel.classList.remove("sel"); tbub = tsel = null;
  if (!t) return;
  const m = METRICS.find(x => x.key === t.dataset.k), d = t.dataset.d, v = entries[d]?.[m.key];
  const word = !has(v) ? "" : v === 0 ? (m.high ? " · Bad" : " · None") : v === 5 ? (m.high ? " · Good" : " · Max") : "";
  const card = $("trend"); tsel = t; t.classList.add("sel");
  tbub = document.createElement("div"); tbub.className = "tbub";
  tbub.innerHTML = `${esc(longDay(d))}<br><b>${esc(m.name)} ${has(v) ? v + word : "– no entry"}</b>`;
  card.append(tbub);
  const cr = t.getBoundingClientRect(), pr = card.getBoundingClientRect(), want = cr.left - pr.left + cr.width / 2, half = tbub.offsetWidth / 2;
  const x = Math.max(half + 4, Math.min(pr.width - half - 4, want));
  tbub.style.left = x + "px"; tbub.style.top = (cr.top - pr.top - 6) + "px";
  tbub.style.setProperty("--ax", (50 + (want - x) / tbub.offsetWidth * 100) + "%");
}
$("trend").addEventListener("click", e => {
  const t = e.target.closest(".cell, .tbar"); if (!t) return;
  trendBubble(t === tsel ? null : t);
});
document.addEventListener("click", e => { if (tbub && !$("trend").contains(e.target)) trendBubble(null); });

// ---- tabs
let currentTab = "checkin";
function showTab(name) {
  currentTab = name;
  for (const t of ["checkin", "weight", "settings"]) {
    $(`tab-${t}`).hidden = t !== name;
    $(`tb-${t}`).setAttribute("aria-selected", String(t === name));
  }
  document.body.classList.toggle("on-settings", name === "settings");
  if (name === "checkin") { const pg = $("tPages"); pg.style.scrollBehavior = "auto"; pg.scrollLeft = trendPage * pg.clientWidth; pg.style.scrollBehavior = ""; }
  window.scrollTo(0, 0);
  try { localStorage.setItem("dailydials.tab", name); } catch {}
  if (name === "weight") { renderDay(); renderCharts(); }
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });

// ---- number charts (adapted from the R/plotly weight chart): daily readings as dots,
// a monthly / weekly / daily line with missing days filled in by straight lines, a dashed target, range chips
const CH = { range: "1Y", view: "M" };
try { Object.assign(CH, JSON.parse(localStorage.getItem("dailydials.chart") || "{}")); } catch {}
const RANGES = { "1M": 31, "3M": 92, "1Y": 366, "5Y": 1827, "All": Infinity };
const dayNum = s => { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const dayStr = n => new Date(n * 864e5).toISOString().slice(0, 10);
const fmtDay = (n, opts) => new Date(n * 864e5).toLocaleDateString(undefined, { timeZone: "UTC", ...opts });
function readings(key) {          // [dayNumber, value] for days actually entered (not carried forward)
  return Object.keys(entries).filter(d => has(entries[d]?.[key]) && Number(entries[d][`${key}_carried`]) !== 1).sort().map(d => [dayNum(d), Number(entries[d][key])]);
}
function filled(pts) {             // every day from first to last reading, gaps filled by straight lines
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    out.push(pts[i]);
    const nx = pts[i + 1]; if (!nx) break;
    for (let t = pts[i][0] + 1; t < nx[0]; t++) out.push([t, pts[i][1] + (nx[1] - pts[i][1]) * (t - pts[i][0]) / (nx[0] - pts[i][0])]);
  }
  return out;
}
function grouped(daily, keyOf) {   // average of the filled-in days in each week or month
  const g = new Map();
  for (const [t, v] of daily) { const k = keyOf(t); const a = g.get(k) || [0, 0]; a[0] += v; a[1]++; g.set(k, a); }
  return [...g.entries()].map(([k, [sum, n]]) => [k, sum / n]).sort((a, b) => a[0] - b[0]);
}
const weekStart = t => t - ((t + 4) % 7);                 // Sunday, like lubridate's floor_date(unit = "week")
const monthStart = t => dayNum(dayStr(t).slice(0, 8) + "01");
function buildChart(m) {
  const el = document.createElement("section");
  el.className = "panel chart-panel"; el.id = `ch-${m.key}`;
  el.innerHTML = `<h2 style="margin:0">${esc(m.name)} trend</h2>
    <div class="stats" id="st-${m.key}"></div>
